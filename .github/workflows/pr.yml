name: PR

on:
  pull_request:
    branches:
      - main

jobs:
  pr:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Compute node modules cache key
        id: nodeModulesCacheKey
        run: echo "value=$(node packages/build/src/computeNodeModulesCacheKey.ts)" >> $GITHUB_OUTPUT
        shell: bash
      - uses: actions/cache@v6
        id: npm-cache
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-cacheNodeModules-${{ steps.nodeModulesCacheKey.outputs.value }}
      - name: npm ci
        run: npm ci
        if: steps.npm-cache.outputs.cache-hit != 'true'
      - run: npm run build
      - run: npm run build:static
      - run: npm test
      - run: npm run test-integration
      - run: npm run type-check
      - run: npm run lint
      - name: install playwright dependencies
        working-directory: ./packages/e2e
        run: npx playwright install chromium
        if: steps.npm-cache.outputs.cache-hit != 'true'
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: e2e
        working-directory: ./packages/e2e
        run: npm run e2e:headless
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: measure
        run: npm run measure
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0

  firefox:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - run: npm ci
      - run: npm run build
      - run: npm run build:static
      - name: install Firefox
        run: npx playwright install --with-deps firefox
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - run: npm run e2e:firefox:headless
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0

  electron:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - run: npm ci
      - run: npm run build
      - name: Prepare Electron app with candidate worker
        run: |
          curl --fail --location https://github.com/lvce-editor/lvce-editor/releases/download/v0.115.4/lvce-v0.115.4_amd64.deb --output .tmp/lvce.deb
          dpkg-deb --extract .tmp/lvce.deb .tmp/electron
          cp .tmp/dist/dist/extensionDetailViewWorkerMain.js .tmp/electron/usr/lib/lvce/resources/app/static/*/packages/extension-detail-view-worker/dist/extensionDetailViewWorkerMain.js
      - name: Electron link browser regression
        run: |
          task_profile=$(mktemp -d "$RUNNER_TEMP/extension-link-browser-XXXXXX")
          xvfb-run --auto-servernum npm exec --workspace=packages/e2e -- test-with-playwright --electron --electron-path="$PWD/.tmp/electron/usr/lib/lvce/lvce" --electron-env="XDG_CONFIG_HOME=$task_profile/config" --electron-env="XDG_DATA_HOME=$task_profile/data" --electron-env="XDG_STATE_HOME=$task_profile/state" --electron-env="XDG_CACHE_HOME=$task_profile/cache" --only-extension=. --test-path=../e2e-electron
